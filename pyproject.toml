[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screentext"
version = "1.0.0"
description = "A local-first Windows screen-region OCR utility."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PySide6>=6.7,<7", "Pillow>=10.0,<13", "pytesseract>=0.3.10,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["screentext*"]
